<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square with Gradient -->
  <rect x="10" y="10" width="80" height="80" rx="20" fill="url(#bg-grad)" filter="url(#shadow)"/>
  
  <!-- Overlapping Cards Design -->
  <!-- Back Card -->
  <rect x="25" y="25" width="45" height="45" rx="8" fill="#FFFFFF" opacity="0.3" transform="rotate(-10 47.5 47.5)"/>
  <!-- Front Card -->
  <rect x="30" y="30" width="45" height="45" rx="8" fill="#FFFFFF" filter="url(#shadow)"/>
  
  <!-- Lightning Bolt (Spaced Repetition / Zap theme) in the center of front card -->
  <path d="M54,37 L43,49 L51,49 L46,59 L57,47 L49,47 Z" fill="url(#bolt-grad)"/>
</svg>
